name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # o runner ubuntu-latest já traz o Android SDK em $ANDROID_HOME
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do módulo protocolos
        run: ./gradlew --no-daemon :protocolos:test

      - name: APK debug
        run: ./gradlew --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: controle-tv-debug
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-testes
          path: protocolos/build/reports/tests/
